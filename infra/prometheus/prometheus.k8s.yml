global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names:
          - api-headless
        type: A
        port: 8000

  - job_name: drift
    static_configs:
      - targets:
          - drift:8001
