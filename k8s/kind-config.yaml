kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: movie-recsys
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30500
        hostPort: 5000
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
    extraMounts:
      - hostPath: __PROJECT_DIR__/data/processed
        containerPath: /mnt/data/processed
        readOnly: true
      - hostPath: __PROJECT_DIR__/reports
        containerPath: /mnt/reports
