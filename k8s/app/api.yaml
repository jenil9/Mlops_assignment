---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: movie-recsys
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: movie-recsys-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REPLICA_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: params
              mountPath: /app/params.yaml
              subPath: params.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: params
          configMap:
            name: params
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: movie-recsys
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  namespace: movie-recsys
spec:
  clusterIP: None
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
